<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glowA" cx="12%" cy="0%" r="80%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="96%" cy="10%" r="70%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="110%" r="70%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffe4b5"/>
      <stop offset="0.45" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="moonG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd79a"/>
      <stop offset="1" stop-color="#c79bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d0b14"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>

  <g fill="#ffffff">
    <circle cx="140" cy="96" r="1.8" opacity="0.7"/>
    <circle cx="318" cy="58" r="1.2" opacity="0.45"/>
    <circle cx="512" cy="128" r="1.5" opacity="0.35"/>
    <circle cx="1084" cy="188" r="1.9" opacity="0.6"/>
    <circle cx="978" cy="82" r="1.3" opacity="0.4"/>
    <circle cx="214" cy="536" r="1.6" opacity="0.5"/>
    <circle cx="600" cy="586" r="1.2" opacity="0.35"/>
    <circle cx="1128" cy="470" r="1.5" opacity="0.45"/>
  </g>

  <g transform="translate(892 315)">
    <circle r="188" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5" stroke-dasharray="2 9"/>
    <circle r="132" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="2 9"/>
    <circle r="76" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="2 9"/>
    <circle r="21" fill="#8b5cf6" opacity="0.95"/>
    <circle cx="54" cy="-53" r="10" fill="#fbbf24"/>
    <circle cx="-66" cy="38" r="9" fill="#fcd34d"/>
    <circle cx="104" cy="80" r="8.5" fill="#38bdf8"/>
    <circle cx="-118" cy="-58" r="8" fill="#7dd3fc"/>
    <circle cx="26" cy="128" r="7.5" fill="#818cf8"/>
    <circle cx="-166" cy="90" r="7" fill="#f472b6"/>
    <circle cx="176" cy="-66" r="6.5" fill="#a78bfa"/>
  </g>

  <g transform="translate(96 232)">
    <g transform="translate(0 -84)">
      <circle cx="17" cy="17" r="16" fill="none" stroke="#8b5cf6" stroke-width="4"/>
      <circle cx="17" cy="1" r="6" fill="url(#moonG)"/>
      <text x="46" y="26" font-family="'Space Grotesk',system-ui,sans-serif" font-size="25" font-weight="600" fill="#c9c4dd" letter-spacing="0.5">Orbit</text>
    </g>
    <text font-family="'Space Grotesk',system-ui,sans-serif" font-size="76" font-weight="600" fill="url(#head)" letter-spacing="-3.4">
      <tspan x="0" y="0">Fewer people,</tspan>
      <tspan x="0" y="86">deeper bonds.</tspan>
    </text>
    <text font-family="'Space Grotesk',system-ui,sans-serif" font-size="27" font-weight="400" fill="#a29dba" letter-spacing="-0.4">
      <tspan x="0" y="164">Orbit keeps your closest people close  and</tspan>
      <tspan x="0" y="204">tells you exactly what to do tonight.</tspan>
    </text>
  </g>
