name = "orbit-concierge"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[vars]
# Comma-separated. Any localhost port is allowed automatically.
ALLOWED_ORIGINS = "https://getorbit.pages.dev,https://getorbit.fyi,https://jlin3.github.io,http://localhost:4747"

# Fallback cap per IP per day, used when the rate-limiting binding below is off.
DAILY_LIMIT = "200"

# Override the default models if you want cheaper or newer ones.
# OPENAI_MODEL = "gpt-5.6"
# XAI_MODEL = "grok-4.6"
# ANTHROPIC_MODEL = "claude-sonnet-4-5"
# GEMINI_MODEL = "gemini-2.5-flash"

# Shared per-city feed. Write key: wrangler secret put FEED_ADMIN_KEY
[[kv_namespaces]]
binding = "FEED"
id = "ffc2435266eb496abdabd4c1b00a1601"

# Burst cap so a single IP can't drain the daily budget in one loop.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Secrets are never stored here. Set at least one provider key:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put XAI_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY
