name = "orbit-concierge"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[vars]
# Comma-separated. Any localhost port is allowed automatically.
ALLOWED_ORIGINS = "https://jlin3.github.io,http://localhost:4747"

# Fallback cap per IP per day, used when the rate-limiting binding below is off.
DAILY_LIMIT = "40"

# Override the default models if you want cheaper or newer ones.
# OPENAI_MODEL = "gpt-5.6"
# XAI_MODEL = "grok-4.6"

# Native per-IP rate limiting. Uncomment to enforce a real limit across
# isolates; without it the Worker falls back to a weaker in-memory counter.
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 40, period = 60 }

# Secrets are never stored here. Set at least one:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put XAI_API_KEY
